apiVersion: 1

datasources:
  - name: Cellect Team PostgreSQL
    uid: cellect-scada-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: 127.0.0.1:5433
    user: grafana
    editable: false
    secureJsonData:
      password: $CELLECT_PG_PASSWORD
    jsonData:
      database: battery
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 3
      maxIdleConns: 1
      maxIdleConnsAuto: false
      connMaxLifetime: 600
